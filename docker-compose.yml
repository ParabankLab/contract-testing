services:
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/inventory/SKU-100"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pact-broker
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: pact_broker.sqlite
    volumes:
      - pact_data:/sqlite

volumes:
  pact_data: